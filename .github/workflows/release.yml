name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$last_tag" ]; then
            base_version=$(node -p "require('./manifest.json').version || '0.0.1'")
            version="$base_version"
          else
            ver="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            version="${major}.${minor}.${patch}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "last_tag=${last_tag}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          last_tag="${{ steps.meta.outputs.last_tag }}"
          date="$(date -u +%Y-%m-%d)"

          if [ -n "$last_tag" ]; then
            git log "${last_tag}"..HEAD --pretty=format:"- %s (%h)" > .release-notes.tmp
          else
            git log --pretty=format:"- %s (%h)" > .release-notes.tmp
          fi

          {
            echo "## ${tag} (${date})"
            echo
            cat .release-notes.tmp
          } > RELEASE_NOTES.md

      - name: Package extension
        run: |
          mkdir -p dist
          pkg_dir="dist/package"
          rm -rf "$pkg_dir"
          mkdir -p "$pkg_dir"

          # Export all tracked files so newly added files are included automatically.
          git archive --format=tar HEAD | tar -xf - -C "$pkg_dir"

          # Keep packaged manifest/package version aligned with release tag version.
          node - "$pkg_dir" "${{ steps.meta.outputs.version }}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const pkgDir = process.argv[2];
          const version = process.argv[3];
          const targets = ['manifest.json', 'package.json'];

          for (const file of targets) {
            const fullPath = path.join(pkgDir, file);
            if (!fs.existsSync(fullPath)) {
              continue;
            }
            const json = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            json.version = version;
            fs.writeFileSync(fullPath, `${JSON.stringify(json, null, 2)}\n`);
          }
          NODE

          (
            cd "$pkg_dir"
            zip -r "../outlook-chrome-extension-${{ steps.meta.outputs.tag }}.zip" .
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/outlook-chrome-extension-${{ steps.meta.outputs.tag }}.zip
